name: check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: dist/ がソースと一致しているか（ビルド後にコミットし忘れていないか）
        run: git diff --exit-code --stat -- dist/public dist/main.mjs || (echo "::warning::dist/ が古いです。npm run build してコミットしてください"; true)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore
